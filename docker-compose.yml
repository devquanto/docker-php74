version: '3.0'

services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 80:80
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./projetos:/var/www/html/
      - ./.apache/etc/apache2/sites-enabled/000-default.conf:/etc/apache2/sites-enabled/000-default.conf
      - ./.php/conf.d/xdebug.ini:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini
      - ./.php/conf.d/php.ini:/usr/local/etc/php/php.ini
      # - ./.bin/:/usr/local/bin/composer
    networks:
      - trabalho_network
  db:
    image: mysql:8.0.29
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_USER: desenv
      MYSQL_PASSWORD: 123456
    ports:
      - 3306:3306
    volumes:
      - ./.mysql/data:/var/lib/mysql
      - ./.mysql/log:/var/log
      - ./.mysql/conf/my.cnf:/etc/my.cnf
    networks:
      - trabalho_network
  # postgres:
    # image: postgres
    # restart: always
    # environment:
    #   POSTGRES_PASSWORD: postgres
    # ports:
    #   - 5432:5432
    # volumes:
    #   - ./.postgres/data:/var/lib/postgresql/data
    #   - ./.postgres/dumps:/home
    # networks:
    #   - trabalho_network    
networks:
  trabalho_network:
    name: trabalho_network
    driver: bridge